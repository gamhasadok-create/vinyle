<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8a7b4;
    --rose-pale: #f9e6e9;
    --rose-fonce: #c0667b;
    --creme: #fcf7ef;
    --encre: #4d353a;
    --doux: #9a7b80;
    --vert: #93a98d;
    --or: #c9a66b;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --script: "Pinyon Script", "Snell Roundhand", "Brush Script MT", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--serif);
    color: var(--encre);
    background:
      radial-gradient(circle at 15% 10%, #fdf1f2 0, transparent 45%),
      radial-gradient(circle at 90% 85%, #f6d9de 0, transparent 50%),
      var(--rose-pale);
    padding: 26px 16px 48px;
    overflow-x: hidden;
  }
  body.ferme { overflow: hidden; height: 100vh; }
  svg { display: block; }

  /* ---------- INTRO : rideau + photo ---------- */
  #intro { position: fixed; inset: 0; z-index: 20; overflow: hidden; }
  .rideau {
    position: absolute; top: 0; bottom: 0; width: 50.5%;
    background: repeating-linear-gradient(90deg, #f7d6dc 0, #eab5c1 30px, #f7d6dc 60px);
    box-shadow: inset 0 -60px 80px rgba(160, 80, 100, .18);
    transition: transform 2s cubic-bezier(.7, 0, .2, 1);
  }
  .rideau.gauche { left: 0; border-right: 2px solid var(--or); }
  .rideau.droite { right: 0; border-left: 2px solid var(--or); }
  #intro.ouvert .gauche { transform: translateX(-103%); }
  #intro.ouvert .droite { transform: translateX(103%); }

  .carte {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; text-align: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  #intro.eclosion .carte { opacity: 0; transform: scale(.95); pointer-events: none; }
  .surtitre { font-size: .8rem; letter-spacing: .32em; text-transform: uppercase; color: var(--rose-fonce); }
  .cadre { position: relative; width: min(60vw, 270px); }
  .arche {
    aspect-ratio: 3 / 4.3;
    border-radius: 999px 999px 14px 14px;
    overflow: hidden;
    border: 7px solid var(--creme);
    outline: 1px solid var(--or);
    box-shadow: 0 18px 40px rgba(140, 70, 90, .35);
    background: var(--creme);
  }
  .arche img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 78%; display: block; }
  .cadre svg { position: absolute; }
  .cadre .f1 { width: 62px; left: -26px; bottom: -14px; color: #f3b9c4; }
  .cadre .f2 { width: 40px; left: 24px; bottom: -22px; color: #fbe3e7; }
  .cadre .f3 { width: 54px; right: -22px; bottom: -12px; color: #e99aab; }
  .cadre .f4 { width: 34px; right: 22px; bottom: -20px; color: #fdeef0; }
  .cadre .b1 { width: 34px; left: -30px; bottom: 26px; transform: rotate(-28deg); }
  .cadre .b2 { width: 34px; right: -30px; bottom: 26px; transform: rotate(28deg) scaleX(-1); }
  .noms { font-family: var(--script); font-size: clamp(2.3rem, 10vw, 3.2rem); color: var(--rose-fonce); line-height: 1.1; margin-top: 12px; }
  #ouvrir {
    font: italic 1.15rem var(--serif); color: var(--encre);
    background: var(--creme); border: 1px solid var(--or); border-radius: 999px;
    padding: 11px 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 9px;
    box-shadow: 0 6px 16px rgba(140, 70, 90, .22);
    animation: battre 2.4s ease-in-out infinite;
  }
  #ouvrir svg { width: 15px; color: var(--rose-fonce); }
  @keyframes battre { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .eclat { position: absolute; z-index: 2; pointer-events: none; opacity: 0; animation: eclore 3.3s ease-in-out forwards; }
  @keyframes eclore {
    0%   { opacity: 0; transform: scale(0) rotate(-90deg); }
    22%  { opacity: 1; transform: scale(1.1) rotate(0deg); }
    30%  { transform: scale(1) rotate(6deg); }
    62%  { opacity: 1; transform: translateY(0) scale(1) rotate(14deg); }
    100% { opacity: 0; transform: translateY(45vh) scale(.8) rotate(120deg); }
  }

  /* ---------- pétales qui tombent ---------- */
  #petales { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .petale {
    position: absolute; top: -30px; width: 14px; height: 14px;
    border-radius: 80% 0 80% 0; background: var(--rose); opacity: .75;
    animation: tomber linear forwards;
  }
  @keyframes tomber {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(40px, 55vh) rotate(180deg); }
    100% { transform: translate(-20px, 112vh) rotate(380deg); }
  }

  /* ---------- LE SITE ---------- */
  main {
    position: relative; max-width: 460px; margin: 0 auto;
    background: var(--creme);
    border: 1px solid #ecd9c9; border-radius: 6px;
    padding: 34px 24px 30px; text-align: center;
    box-shadow: 0 20px 50px rgba(150, 90, 100, .2);
  }
  main::before {
    content: ""; position: absolute; inset: 8px; border: 1px solid #efd9d6; border-radius: 3px; pointer-events: none;
  }
  .coin { position: absolute; pointer-events: none; }
  .coin.hg { top: -16px; left: -14px; width: 86px; }
  .coin.bd { bottom: -16px; right: -14px; width: 86px; transform: rotate(180deg); }
  h1 { font-family: var(--script); font-weight: normal; font-size: clamp(2.6rem, 11vw, 3.4rem); color: var(--rose-fonce); line-height: 1.1; margin-top: 8px; }
  .filet { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 4px; color: var(--rose); }
  .filet::before, .filet::after { content: ""; height: 1px; width: 60px; background: #e8cfc9; }
  .filet svg { width: 13px; }

  .disque {
    width: 216px; height: 216px; margin: 22px auto 18px; border-radius: 50%; position: relative;
    background: repeating-radial-gradient(circle, #1a1516 0 2px, #2b2325 2px 4px);
    box-shadow: 0 12px 28px rgba(60, 30, 40, .35);
    animation: tourner 3s linear infinite; animation-play-state: paused;
  }
  .disque.joue { animation-play-state: running; }
  .etiquette {
    position: absolute; inset: 31%; border-radius: 50%;
    background: var(--rose-pale); border: 1px solid var(--rose);
    display: flex; align-items: center; justify-content: center; color: var(--rose-fonce);
  }
  .etiquette svg { width: 46%; }
  .etiquette::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--creme); }
  @keyframes tourner { to { transform: rotate(360deg); } }

  #titre { font-size: 1.45rem; font-style: italic; font-weight: 500; min-height: 1.4em; }
  #artiste { color: var(--doux); font-size: .82rem; letter-spacing: .2em; text-transform: uppercase; min-height: 1.3em; margin-top: 2px; }

  .barre { margin: 16px 6px 4px; }
  input[type=range] { width: 100%; accent-color: var(--rose-fonce); }
  .temps { display: flex; justify-content: space-between; font-size: .85rem; color: var(--doux); font-variant-numeric: tabular-nums; }

  .boutons { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 10px 0 24px; }
  .boutons button {
    width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
    background: transparent; border: 1px solid var(--rose); color: var(--rose-fonce);
    display: flex; align-items: center; justify-content: center;
  }
  .boutons button svg { width: 20px; height: 20px; fill: currentColor; }
  .boutons #lecture { width: 66px; height: 66px; background: var(--rose-fonce); border-color: var(--rose-fonce); color: var(--creme); }
  .boutons #lecture svg { width: 26px; height: 26px; }
  button:focus-visible, li:focus-visible { outline: 2px solid var(--rose-fonce); outline-offset: 3px; }

  ol { list-style: none; text-align: left; border-top: 1px solid #ecdcd3; }
  li { display: flex; align-items: baseline; gap: 14px; padding: 12px 6px; border-bottom: 1px solid #ecdcd3; cursor: pointer; }
  li .num { font-style: italic; color: var(--doux); width: 1.7em; }
  li .t { font-size: 1.15rem; display: block; }
  li .a { font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--doux); }
  li.active .t, li.active .num { color: var(--rose-fonce); font-weight: 500; }

  .mot {
    margin: 30px 6px 4px; padding: 20px 20px 18px; text-align: left;
    background: #fdecee; border: 1px solid #f3d3d8; transform: rotate(-1.2deg);
    box-shadow: 0 6px 14px rgba(150, 90, 100, .15);
    font-style: italic; font-size: 1.12rem; line-height: 1.55; white-space: pre-line;
  }
  .mot .entete { font-style: normal; font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; color: var(--rose-fonce); margin-bottom: 8px; }
  .mot .signature { font-family: var(--script); font-style: normal; font-size: 1.9rem; color: var(--rose-fonce); text-align: right; margin-top: 6px; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    .disque, #ouvrir, .eclat, .petale { animation: none; }
    .rideau, .carte { transition-duration: .01s; }
  }
</style>
</head>
<body class="ferme">

<!-- formes réutilisées : fleur, cœur, brin de feuilles -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fleur" viewBox="-52 -52 104 104">
    <g fill="currentColor" stroke="rgba(192,102,123,.35)" stroke-width="1">
      <ellipse cy="-27" rx="15" ry="24"/>
      <ellipse cy="-27" rx="15" ry="24" transform="rotate(72)"/>
      <ellipse cy="-27" rx="15" ry="24" transform="rotate(144)"/>
      <ellipse cy="-27" rx="15" ry="24" transform="rotate(216)"/>
      <ellipse cy="-27" rx="15" ry="24" transform="rotate(288)"/>
    </g>
    <circle r="9" fill="#f3d58f"/>
  </symbol>
  <symbol id="coeur" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </symbol>
  <symbol id="brin" viewBox="0 0 60 120">
    <path d="M30 118 C27 84 34 50 30 8" fill="none" stroke="#93a98d" stroke-width="2" stroke-linecap="round"/>
    <g fill="#93a98d">
      <ellipse cx="18" cy="92" rx="6" ry="14" transform="rotate(-38 18 92)"/>
      <ellipse cx="43" cy="76" rx="6" ry="14" transform="rotate(38 43 76)"/>
      <ellipse cx="18" cy="56" rx="5.5" ry="13" transform="rotate(-38 18 56)"/>
      <ellipse cx="42" cy="40" rx="5" ry="12" transform="rotate(38 42 40)"/>
      <ellipse cx="30" cy="14" rx="4.5" ry="11"/>
    </g>
  </symbol>
  <symbol id="bouquet" viewBox="0 0 120 120">
    <use href="#brin" x="52" y="24" width="44" height="88" transform="rotate(62 74 68)"/>
    <use href="#brin" x="20" y="48" width="40" height="80" transform="rotate(-8 40 88)"/>
    <use href="#fleur" x="6" y="6" width="56" height="56" style="color:#f3b9c4"/>
    <use href="#fleur" x="50" y="2" width="34" height="34" style="color:#fbe3e7"/>
    <use href="#fleur" x="4" y="54" width="30" height="30" style="color:#e99aab"/>
  </symbol>
</svg>

<!-- INTRO -->
<div id="intro">
  <div class="rideau gauche"></div>
  <div class="rideau droite"></div>
  <div class="carte">
    <p class="surtitre" id="intro-pour"></p>
    <div class="cadre">
      <div class="arche"><img id="photo" alt="Notre photo"></div>
      <svg class="b1" viewBox="0 0 60 120"><use href="#brin"/></svg>
      <svg class="b2" viewBox="0 0 60 120"><use href="#brin"/></svg>
      <svg class="f1" viewBox="0 0 104 104"><use href="#fleur"/></svg>
      <svg class="f2" viewBox="0 0 104 104"><use href="#fleur"/></svg>
      <svg class="f3" viewBox="0 0 104 104"><use href="#fleur"/></svg>
      <svg class="f4" viewBox="0 0 104 104"><use href="#fleur"/></svg>
    </div>
    <p class="noms" id="intro-noms"></p>
    <button id="ouvrir">Ouvrir <svg viewBox="0 0 24 24"><use href="#coeur"/></svg></button>
  </div>
</div>

<div id="petales" aria-hidden="true"></div>

<!-- LE SITE -->
<main>
  <svg class="coin hg" viewBox="0 0 120 120" aria-hidden="true"><use href="#bouquet"/></svg>
  <svg class="coin bd" viewBox="0 0 120 120" aria-hidden="true"><use href="#bouquet"/></svg>

  <p class="surtitre" id="dedicace"></p>
  <h1 id="grand-titre"></h1>
  <div class="filet"><svg viewBox="0 0 24 24"><use href="#coeur"/></svg></div>

  <div class="disque" id="disque" aria-hidden="true">
    <div class="etiquette"><svg viewBox="0 0 24 24"><use href="#coeur"/></svg></div>
  </div>

  <p id="titre"></p>
  <p id="artiste"></p>

  <div class="barre">
    <input type="range" id="progression" min="0" max="100" value="0" step="0.1" aria-label="Progression">
    <div class="temps"><span id="ecoule">0:00</span><span id="duree">0:00</span></div>
  </div>

  <div class="boutons">
    <button id="precedent" aria-label="Titre précédent"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="lecture" aria-label="Lecture"><svg viewBox="0 0 24 24"><path id="icone" d="M8 5v14l11-7z"/></svg></button>
    <button id="suivant" aria-label="Titre suivant"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>

  <ol id="liste"></ol>

  <div class="mot">
    <p class="entete">Petit mot</p>
    <p id="mot"></p>
    <p class="signature" id="signature"></p>
  </div>

  <audio id="audio" preload="metadata"></audio>
</main>

<script>
/* ==================================================================
   À MODIFIER — tout ce qui est personnel se change ici, nulle part ailleurs.
   ================================================================== */
// Les prénoms : écris-les entre les guillemets, ou laisse "" pour ne pas en afficher.
// IMPORTANT : ne supprime jamais ces deux lignes, sinon le bouton « Ouvrir » ne marche plus.
const POUR  = "";                    // la personne qui reçoit le vinyle
const DE    = "";                    // toi
const TITRE = "Nos chansons";        // le grand titre du site
const PHOTO = "photo.jpg";           // la photo de l'intro (à côté de ce fichier)
const MOT   = `My Dearest,

Je t'ai préparé un disque rien que pour nous. Chaque chanson est un souvenir, et il en reste tant à écrire.

Love youu Endlessly`;

// Tes MP3 vont dans un dossier "musique" à côté de ce fichier.
const PISTES = [
  { titre: "Loveeeeeee",   artiste: "Rihanna", fichier: "musique/piste1.mp3" },
  { titre: "Money Trees",  artiste: "Kendrick Lamar", fichier: "musique/piste2.mp3" },
  { titre: "Lovesong", artiste: "Adele", fichier: "musique/piste3.mp3" },
  { titre: "All of me", artiste: "John Legend", fichier: "musique/piste4.mp3" },
  { titre: "Nam El Layl", artiste: "Fadel Chaker", fichier: "musique/piste5.mp3" },
];
/* ================================================================== */

const $ = id => document.getElementById(id);
const audio = $("audio"), disque = $("disque"), liste = $("liste"), intro = $("intro");
const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ROSES = ["#f3b9c4", "#e99aab", "#fbe3e7", "#f7cdd5", "#fdeef0", "#eeb0bd"];
const SVG = "http://www.w3.org/2000/svg";
let index = 0;

/* ----- textes ----- */
document.title = TITRE;
$("photo").src = PHOTO;
$("intro-pour").textContent = POUR ? "Pour " + POUR : "Pour toi";
$("intro-noms").textContent = [DE, POUR].filter(Boolean).join(" & ");
$("dedicace").textContent = (POUR ? "Pour " + POUR : "Pour toi") + (DE ? " · de " + DE : "");
$("grand-titre").textContent = TITRE;
$("mot").textContent = MOT;
$("signature").textContent = DE;

/* ----- liste des titres ----- */
PISTES.forEach((p, i) => {
  const li = document.createElement("li");
  li.tabIndex = 0;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(i + 1).padStart(2, "0");
  const bloc = document.createElement("span");
  const t = document.createElement("span"); t.className = "t"; t.textContent = p.titre;
  const a = document.createElement("span"); a.className = "a"; a.textContent = p.artiste || "";
  bloc.append(t, a);
  li.append(num, bloc);
  li.addEventListener("click", () => charger(i, true));
  li.addEventListener("keydown", e => { if (e.key === "Enter") charger(i, true); });
  liste.appendChild(li);
});

/* ----- lecteur ----- */
function fmt(s) {
  if (!isFinite(s)) return "0:00";
  return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
}
function charger(i, jouer) {
  index = (i + PISTES.length) % PISTES.length;
  const p = PISTES[index];
  audio.src = p.fichier;
  $("titre").textContent = p.titre;
  $("artiste").textContent = p.artiste || "";
  [...liste.children].forEach((li, n) => li.classList.toggle("active", n === index));
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: p.titre, artist: p.artiste || "", album: TITRE });
  }
  if (jouer) audio.play().catch(() => {});
}
$("lecture").addEventListener("click", () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
$("suivant").addEventListener("click", () => charger(index + 1, true));
$("precedent").addEventListener("click", () => charger(index - 1, true));
audio.addEventListener("play", () => {
  disque.classList.add("joue");
  $("icone").setAttribute("d", "M7 5h4v14H7zM13 5h4v14h-4z");
  $("lecture").setAttribute("aria-label", "Pause");
});
audio.addEventListener("pause", () => {
  disque.classList.remove("joue");
  $("icone").setAttribute("d", "M8 5v14l11-7z");
  $("lecture").setAttribute("aria-label", "Lecture");
});
audio.addEventListener("ended", () => charger(index + 1, true));
audio.addEventListener("loadedmetadata", () => { $("duree").textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  $("ecoule").textContent = fmt(audio.currentTime);
  if (audio.duration) $("progression").value = (audio.currentTime / audio.duration) * 100;
});
audio.addEventListener("error", () => { $("artiste").textContent = "Fichier introuvable : " + PISTES[index].fichier; });
$("progression").addEventListener("input", e => {
  if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
});
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("nexttrack", () => charger(index + 1, true));
  navigator.mediaSession.setActionHandler("previoustrack", () => charger(index - 1, true));
}
charger(0, false);

/* ----- fleurs et pétales ----- */
function forme(id, taille, couleur) {
  const s = document.createElementNS(SVG, "svg");
  s.setAttribute("viewBox", id === "coeur" ? "0 0 24 24" : "0 0 104 104");
  s.style.width = taille + "px";
  s.style.height = taille + "px";
  s.style.color = couleur;
  const u = document.createElementNS(SVG, "use");
  u.setAttribute("href", "#" + id);
  s.appendChild(u);
  return s;
}
function eclosion() {
  for (let i = 0; i < 60; i++) {
    const coeur = i % 6 === 5;
    const taille = coeur ? 18 + Math.random() * 16 : 38 + Math.random() * 62;
    const el = forme(coeur ? "coeur" : "fleur", taille, coeur ? "#c0667b" : ROSES[i % ROSES.length]);
    el.classList.add("eclat");
    el.style.left = (Math.random() * 104 - 6) + "%";
    el.style.top = (Math.random() * 100 - 4) + "%";
    el.style.animationDelay = (Math.random() * 0.9) + "s";
    intro.appendChild(el);
  }
}
function petale() {
  const p = document.createElement("div");
  p.className = "petale";
  const t = 9 + Math.random() * 9;
  p.style.width = p.style.height = t + "px";
  p.style.left = Math.random() * 100 + "%";
  p.style.background = ROSES[Math.floor(Math.random() * ROSES.length)];
  p.style.animationDuration = (9 + Math.random() * 7) + "s";
  p.addEventListener("animationend", () => p.remove());
  $("petales").appendChild(p);
}
if (!calme) { for (let i = 0; i < 4; i++) setTimeout(petale, i * 500); setInterval(petale, 1100); }

/* ----- ouverture : la musique démarre, les fleurs éclosent, le rideau s'ouvre ----- */
$("ouvrir").addEventListener("click", () => {
  audio.play().catch(() => {});
  intro.classList.add("eclosion");
  if (calme) {
    intro.remove(); document.body.classList.remove("ferme"); return;
  }
  eclosion();
  setTimeout(() => { intro.classList.add("ouvert"); document.body.classList.remove("ferme"); }, 1500);
  setTimeout(() => intro.remove(), 4400);
}, { once: true });
</script>
</body>
</html>
